name: Apply AI Major Fix Payload
on:
  push:
    branches: [ "ai-major-fix-2026-10-07" ]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild main.dart from staged payload
        run: |
          python3 - <<'PY'
          import base64, gzip, io, pathlib
          root = pathlib.Path("_ai_patch")
          names = ["aa","ab","ac","ad","ae"]
          parts = [(root / f"main.gz.b64.{n}").read_text() for n in names]
          # The first staged chunk was copied once with one extra base64 character.
          # Find the single-character removal that restores the valid gzip stream.
          first = parts[0]
          rest = "".join(parts[1:])
          good = None
          for i in range(len(first)):
              candidate = first[:i] + first[i+1:] + rest
              try:
                  raw = base64.b64decode(candidate, validate=True)
                  data = gzip.decompress(raw)
                  if data.startswith(b"import ") or data.startswith(b"//"):
                      good = data
                      break
              except Exception:
                  pass
          if good is None:
              raise SystemExit("Could not reconstruct main.dart payload")
          pathlib.Path("lib/main.dart").write_bytes(good)
          PY
          rm -rf _ai_patch
          rm -f .github/workflows/apply-ai-major-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apply comprehensive accounting fixes"
          git push
