name: Build Al-Mohaseb APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Download Cairo Fonts Automatically
        run: |
          mkdir -p assets/fonts
          curl -sL "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bwght%5D.ttf" -o assets/fonts/Cairo-Regular.ttf
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Bold.ttf

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: Al-Mohaseb-APK
          path: build/app/outputs/flutter-apk/app-release.apk
