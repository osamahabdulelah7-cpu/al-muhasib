name: Build Al-Mohaseb APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Download Fonts and Icon
        run: |
          mkdir -p assets/fonts
          
          echo "📥 تحميل الخطوط..."
          curl -fL "https://fonts.gstatic.com/s/cairo/v31/SLXgc1nY6HkvangtZmpQdkhzfH5lkSs2SgRjCAGMQ1z0hOA-W1ToLQ-HmkA.ttf" \
            -o assets/fonts/Cairo-Regular.ttf
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Bold.ttf
          
          echo "📥 تحميل الشعار..."
          curl -fL "https://api.iconify.design/mdi/alpha-m-circle.svg?color=%23FFB300&width=512&height=512" \
            -o assets/icon.svg
          
          echo "📥 تحويل SVG إلى PNG..."
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          
          echo "=== التحقق ==="
          ls -lh assets/
          file assets/icon.png

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # ============================================
      # ✅ توليد Keystore ثابت (يُنفّذ مرة واحدة فقط)
      # ============================================
      - name: Generate Stable Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass android123 \
            -alias almuhasib \
            -keypass android123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Al Muhasib, OU=Development, O=Al Muhasib, L=Yemen, C=YE"

          echo ""
          echo "========================================"
          echo "🔑 SHA-1 CERTIFICATE FINGERPRINT"
          echo "========================================"

          keytool -list -v \
            -keystore release.keystore \
            -storepass android123 \
            -alias almuhasib | grep "SHA1:"

          echo "========================================"
          echo ""

      # ✅ تحويل Keystore إلى Base64 لحفظه
      - name: Convert Keystore to Base64
        run: |
          base64 -w 0 release.keystore > release.keystore.base64
          echo "✅ تم التحويل إلى Base64"
          echo ""
          echo "حجم الملف:"
          ls -lh release.keystore.base64

      # ✅ توقيع APK باستخدام Keystore الثابت
      - name: Sign APK
        run: |
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          $BUILD_TOOLS_PATH/zipalign -v 4 \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-release-aligned.apk

          $BUILD_TOOLS_PATH/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            build/app/outputs/flutter-apk/app-release-aligned.apk

      # ✅ رفع APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: Al-Mohaseb-APK
          path: build/app/outputs/flutter-apk/app-release-signed.apk

      # ✅ رفع Keystore (لتحميله مرة واحدة)
      - name: Upload Keystore
        uses: actions/upload-artifact@v4.3.6
        with:
          name: release-keystore
          path: release.keystore.base64
