name: Build Al-Mohaseb APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      # ============================================
      # ✅ استخراج Keystore من Secrets
      # ============================================
      - name: Decode Keystore from Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "✅ تم استخراج Keystore"
          ls -lh android/app/release.keystore

      # ============================================
      # ✅ عرض SHA-1 للتأكد من ثباته
      # ============================================
      - name: Show SHA-1 Fingerprint
        run: |
          echo "========================================"
          echo "🔑 SHA-1 CERTIFICATE FINGERPRINT"
          echo "========================================"

          keytool -list -v \
            -keystore android/app/release.keystore \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -alias ${{ secrets.KEY_ALIAS }} | grep "SHA1:"

          echo "========================================"

      # ============================================
      # ✅ بناء AAB (Google Play)
      # ============================================
      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release --no-tree-shake-icons

      # ============================================
      # ✅ بناء APK (للتثبيت المباشر)
      # ============================================
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --no-tree-shake-icons

      # ============================================
      # ✅ رفع AAB
      # ============================================
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: Al-Mohaseb-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      # ============================================
      # ✅ رفع APK
      # ============================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: Al-Mohaseb-APK
          path: build/app/outputs/flutter-apk/app-release.apk
