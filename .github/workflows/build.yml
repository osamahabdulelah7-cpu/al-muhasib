name: Build Al-Mohaseb APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Download Cairo Fonts Automatically
        run: |
          mkdir -p assets/fonts
          echo "📥 تحميل Cairo-Regular.ttf..."
          curl -fL "https://github.com/google/fonts/raw/main/ofl/cairo/static/Cairo-Regular.ttf" \
            -o assets/fonts/Cairo-Regular.ttf
          
          echo "📥 تحميل Cairo-Bold.ttf..."
          curl -fL "https://github.com/google/fonts/raw/main/ofl/cairo/static/Cairo-Bold.ttf" \
            -o assets/fonts/Cairo-Bold.ttf
          
          echo "=== التحقق من الخطوط ==="
          ls -lh assets/fonts/
          file assets/fonts/*.ttf
          
          REG_SIZE=$(stat -c%s assets/fonts/Cairo-Regular.ttf 2>/dev/null || echo 0)
          BOLD_SIZE=$(stat -c%s assets/fonts/Cairo-Bold.ttf 2>/dev/null || echo 0)
          
          if [ "$REG_SIZE" -lt 100000 ]; then
            echo "❌ فشل تحميل Cairo-Regular.ttf"
            cat assets/fonts/Cairo-Regular.ttf | head -c 500
            exit 1
          fi
          
          if [ "$BOLD_SIZE" -lt 100000 ]; then
            echo "❌ فشل تحميل Cairo-Bold.ttf"
            exit 1
          fi
          
          echo "✅ الخطوط جاهزة"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Sign APK Automatically
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_PATH/zipalign -v 4 build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-aligned.apk
          $BUILD_TOOLS_PATH/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out build/app/outputs/flutter-apk/app-release-signed.apk build/app/outputs/flutter-apk/app-release-aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: Al-Mohaseb-APK
          path: build/app/outputs/flutter-apk/app-release-signed.apk
