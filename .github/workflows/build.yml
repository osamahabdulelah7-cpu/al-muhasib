name: Build Al-Mohaseb
permissions:
  contents: read

on:
  push:
    branches: [ "main", "master", "feature/customer-automatic-messages" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Give every workflow run its own concurrency group so new builds do not cancel older runs.
concurrency:
  group: build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      # telephony 0.2.0 predates Android's required Gradle namespace declaration.
      # Patch the resolved package in the CI cache; application source remains untouched.
      - name: Patch legacy telephony Android namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          matches = list(Path.home().glob('.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle'))
          if not matches:
              matches = list(Path.home().glob('.pub-cache/hosted/*/telephony-0.2.0/android/build.gradle'))
          if not matches:
              print('telephony 0.2.0 Android build.gradle was not found')
              sys.exit(1)
          path = matches[0]
          text = path.read_text()
          if 'namespace' not in text:
              if 'android {' not in text:
                  print('Could not find android block in telephony build.gradle')
                  sys.exit(1)
              text = text.replace('android {', 'android {\\n    namespace "com.shounakmulay.telephony"', 1)
              path.write_text(text)
          print(f'Namespace verified in {path}')
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --fatal-warnings
      - name: Run tests
        run: flutter test --reporter expanded
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are required to build the Release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Build split Release APKs only
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload split Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: Al-Mohaseb-Release-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.keystore
