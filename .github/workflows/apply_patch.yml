name: Apply Al-Mohaseb Patch

on:
  push:
    paths:
      - "al_muhasib_final_patch_ready.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract patch
        run: |
          unzip -q al_muhasib_final_patch_ready.zip -d _patch
          test -f _patch/al_muhasib_final_patch/lib/main.dart
          cp -a _patch/al_muhasib_final_patch/. .

      - name: Remove old signing workflow
        run: rm -f .github/workflows/generate-keystore.yml

      - name: Commit complete patch
        run: |
          rm -rf _patch
          rm -f al_muhasib_final_patch_ready.zip
          rm -f DELETE_generate-keystore.yml.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply complete Al-Mohaseb stability patch"
          git push
