name: Generate pubspec.lock
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-pubspec-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate lockfile
        run: flutter pub get
      - name: Commit lockfile to selected branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock is already up to date; no commit needed."
            exit 0
          fi
          git commit -m "chore: generate pubspec.lock"
          git push origin "HEAD:${BRANCH_NAME}"
