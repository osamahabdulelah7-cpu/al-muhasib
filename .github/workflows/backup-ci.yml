name: Backup CI
on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: backup-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --fatal-warnings
      - run: flutter test --reporter expanded
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --debug --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: al-mohaseb-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14