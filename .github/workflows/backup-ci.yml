name: Backup CI
# Final validation for backup scheduling, Drive retry handling, SAF, restore, and retention.

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

# Push builds are handled by build.yml to avoid running the same full checks twice.
# Keep PR, scheduled, and manual backup-focused validation.
concurrency:
  group: backup-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --fatal-warnings
      - name: Run tests
        run: flutter test --reporter expanded
      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons
      - name: Build debug APK (no signing secrets required)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: al-muhasib-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
