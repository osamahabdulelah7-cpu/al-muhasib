name: Generate Keystore (One-Time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias almuhasib \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "Osama@2026Almuhasib" \
            -keypass "Osama@2026Almuhasib" \
            -dname "CN=Osama Al-Adhrai, OU=Development, O=Al-Muhasib, L=Sanaa, ST=Sanaa, C=YE"

      - name: Convert to Base64
        run: |
          echo "========================================"
          echo "🔑 KEYSTORE BASE64 (انسخ هذا النص)"
          echo "========================================"
          base64 -w 0 release.keystore
          echo ""
          echo "========================================"

      - name: Upload Keystore as Artifact
        uses: actions/upload-artifact@v4.3.6
        with:
          name: release-keystore
          path: release.keystore
