name: al_muhasib
description: "تطبيق دفتر المحاسب الشامل لجميع الحسابات والعملات"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  url_launcher: ^6.2.1

  # إصدارات متوافقة مع Flutter
  pdf: 3.10.7
  printing: 5.11.1

  # مكتبات النسخ الاحتياطي والمشاركة
  file_picker: ^8.0.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # مسارات الخطوط المحلية
  # ملاحظة: يرجى التأكد من إنشاء مجلد باسم assets/fonts ووضع ملفات الخطوط بنفس المسميات (Cairo-Regular.ttf و Cairo-Bold.ttf) بداخله.
  assets:
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf
