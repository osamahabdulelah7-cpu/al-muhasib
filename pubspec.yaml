name: al_muhasib
description: "تطبيق دفتر المحاسب الشامل لجميع الحسابات والعملات"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  url_launcher: ^6.2.1

  pdf: ^3.10.7
  printing: ^5.11.1

  file_picker: ^8.0.0
  share_plus: ^10.0.0

  excel: ^4.0.6

  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  permission_handler: ^11.3.0
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/icon.png"
